    <!-- GitHub Pages SPA routing fix -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.split("/").slice(0, 2).join("/") +
              decoded +
              l.hash
          );
        }
      })(window.location);
    </script>
